<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Interview Simulator</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  button, select, textarea { font-size: 1rem; padding: .5rem; margin: .25rem 0; }
  textarea { width: 100%; box-sizing: border-box; min-height: 5rem; }
  #question { font-size: 1.2rem; font-weight: 600; margin: 1rem 0; }
  .hidden { display: none; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: .75rem; margin: .5rem 0; }
</style>
</head>
<body>
<h1>Smart Interview Simulator</h1>

<div id="setup">
  <select id="role">
    <option value="backend">Backend</option>
    <option value="frontend">Frontend</option>
    <option value="devops">DevOps</option>
  </select><br>
  <label>Resume (PDF, optional): <input type="file" id="resume" accept=".pdf"></label><br>
  <button id="start">Start interview</button>
</div>


<div id="interview" class="hidden">
  <div id="question"></div>
  <textarea id="answer" placeholder="Speak or type your answer"></textarea><br>
  <button id="mic">🎤 Speak</button>
  <button id="send">Send answer</button>
</div>


<div id="status"></div>
<div id="report"></div>

<script>
const $ = (id) => document.getElementById(id);
let ws, recorder, stream, chunks = [];

function esc(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}


function speak(text, onEnd) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.onend = onEnd || null;
  speechSynthesis.speak(u);
}

function stopStream() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null;
}


async function startRecording() {  if (recorder && recorder.state === "recording") return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    $("status").textContent = "Mic error: " + e.name;
    return;
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = () => {
    stopStream();
    $("mic").textContent = "🎤 Speak";
    if (!chunks.length) return;
    $("status").textContent = "Transcribing...";
    ws.send(new Blob(chunks, { type: recorder.mimeType }));
  };
  recorder.start();
  $("mic").textContent = "⏹ Stop";
  $("status").textContent = "Recording... click Stop when done";
}


function toggleMic() {
  speechSynthesis.cancel();
  if (recorder && recorder.state === "recording") recorder.stop();
  else startRecording();
}

function discardRecording() {
  if (recorder && recorder.state === "recording") {
    recorder.onstop = null;
    recorder.stop();
  }
  stopStream();
  $("mic").textContent = "🎤 Speak";
}


function handle(msg) {
  if (msg.type === "question") {
    $("question").textContent = msg.text;
    $("answer").value = "";
    speak(msg.text, startRecording);
  } else if (msg.type === "transcript") {
    $("answer").value = msg.text
    $("status").textContent = "Edit if needed, then click Send answer.";
  } else if (msg.type === "processing") {
    $("interview").classList.add("hidden");
    $("status").textContent = "Evaluating your answers...";
    pollResult(msg.interview_id);
  } else if (msg.type === "error") {
    $("status").textContent = msg.message;
  }
}

async function pollResult(id) {
  for (let i = 0; i < 60; i++) {
    const data = await (await fetch(`/interviews/${id}`)).json();
    if (data.status === "done") return showReport(data);
    if (data.status === "failed") break;
    await new Promise((r) => setTimeout(r, 1500));
  }
  $("status").textContent = "Evaluation failed or took too long.";
  $("setup").classList.remove("hidden");
}


function showReport(data) {
  $("status").textContent = "";
  $("setup").classList.remove("hidden");
  const items = data.details.map((d) => `
    <div class="card">
      <b>${esc(d.question)}</b><br>
      Your answer: ${esc(d.answer)}<br>
      Score: ${d.score ?? "n/a"}/10 (${esc(d.topic)})<br>
      ${esc(d.feedback)}
    </div>`).join("");
  $("report").innerHTML = `<h2>Average score: ${data.average}</h2>${items}`;
}

$("start").onclick = async () => {
  let resumeId = null;
  const file = $("resume").files[0];
  if (file) {
    const form = new FormData();
    form.append("file", file);
    const res = await fetch("/resume", { method: "POST", body: form });
    if (!res.ok) {
      $("status").textContent = "Resume error: " + (await res.json()).detail;
      return;
    }
    resumeId = (await res.json()).resume_id;
  }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/interview`);
  ws.onopen = () =>
    ws.send(JSON.stringify({ type: "start", role: $("role").value, resume_id: resumeId }));
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  $("report").innerHTML = "";
  $("setup").classList.add("hidden");
  $("interview").classList.remove("hidden");
};

$("mic").onclick = toggleMic;


$("send").onclick = () => {
  const text = $("answer").value.trim();
  if (!text) return;
  discardRecording();
  speechSynthesis.cancel();
  ws.send(JSON.stringify({ type: "answer", text }));
};

</script>
</body>
</html>
