x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/interviews
    REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "8000:8000"


  worker:
    <<: *app
    command: python worker.py

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interviews
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviews"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: